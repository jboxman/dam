[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dam"
version = "1.0.0"
description = "Manage digital photos"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "click>=8,<9",
]

[project.scripts]
dam = "dam.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dam = ["resources/exiftool.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
